<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FactoryFlow - Stock Transaction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="app-container">

    <aside class="sidebar">

        <div class="sidebar-logo">
            <h2>FactoryFlow</h2>
            <span>Manufacturing System</span>
        </div>

        <div class="sidebar-menu">

            <div class="menu-title">MAIN</div>

            <a href="{{ url_for('home') }}" class="menu-item">
                <span>📊</span>
                Dashboard
            </a>

            <a href="{{ url_for('machines') }}" class="menu-item">
                <span>⚙️</span>
                Machines
            </a>

            <a href="{{ url_for('products') }}" class="menu-item">
                <span>📦</span>
                Products
            </a>

            <a href="{{ url_for('production') }}" class="menu-item">
                <span>🏭</span>
                Production
            </a>

            <a href="{{ url_for('inventory') }}" class="menu-item active">
                <span>📋</span>
                Inventory
            </a>

        </div>

    </aside>


    <main class="main-content">

        <div style="padding:30px; max-width:800px;">

            <h1>Stock Transaction</h1>

            <p>Record stock-in or stock-out operations.</p>

            <br>

            <form method="POST">

                <label>Raw Material</label>

                <select name="material_id"
                        required
                        style="width:100%; padding:12px; margin:8px 0 18px;">

                    <option value="">Select Material</option>

                    {% for material in materials %}

                    <option value="{{ material[0] }}">
                        {{ material[1] }} - {{ material[2] }}
                    </option>

                    {% endfor %}

                </select>


                <label>Transaction Type</label>

                <select name="transaction_type"
                        required
                        style="width:100%; padding:12px; margin:8px 0 18px;">

                    <option value="Stock In">
                        Stock In
                    </option>

                    <option value="Stock Out">
                        Stock Out
                    </option>

                </select>


                <label>Quantity</label>

                <input type="number"
                       name="quantity"
                       step="0.01"
                       min="0.01"
                       required
                       style="width:100%; padding:12px; margin:8px 0 18px;">


                <label>Warehouse Location</label>

                <input type="text"
                       name="warehouse_location"
                       placeholder="Example: Warehouse A"
                       required
                       style="width:100%; padding:12px; margin:8px 0 18px;">


                <label>Notes</label>

                <textarea name="notes"
                          rows="4"
                          placeholder="Optional transaction notes"
                          style="width:100%; padding:12px; margin:8px 0 18px;"></textarea>


                <button type="submit"
                        class="btn btn-primary">
                    Save Transaction
                </button>

                <a href="{{ url_for('inventory') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </main>

</div>

</body>
</html>
